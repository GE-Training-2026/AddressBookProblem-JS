<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Address Book</h1>
            <div class="controls">
                <input type="text" id="searchInput" placeholder="Search by name or city...">
                <select id="sortSelect">
                    <option value="name">Sort by Name</option>
                    <option value="city">Sort by City</option>
                    <option value="state">Sort by State</option>
                </select>
                <button id="addBtn" class="btn primary">Add New Person</button>
            </div>
        </header>

        <main>
            <div id="contactGrid" class="employee-grid">
                </div>
        </main>
    </div>

    <div id="contactModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modalTitle">Add Person</h2>
            <form id="contactForm">
                <input type="hidden" id="contactId">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="phone" required>
                </div>
                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="city" required>
                </div>
                <div class="form-group">
                    <label>State</label>
                    <input type="text" id="state" required>
                </div>
                <div class="form-actions">
                    <button type="button" id="cancelBtn" class="btn secondary">Cancel</button>
                    <button type="submit" class="btn primary">Save Contact</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
